# easygram versionCode = EASYGRAM_VERSION_BASE + number of commits on the branch (first-parent) after
# EASYGRAM_VERSION_ANCHOR. Every commit (and every upstream merge, as one commit) raises it by 1 automatically,
# APP_VERSION_CODE in gradle.properties is ignored (it stays Telegram's, so upstream merges don't conflict on it).
# See easygram_version.gradle. Print the current value: ./gradlew -q easygramVersionCode
EASYGRAM_VERSION_BASE=7305
