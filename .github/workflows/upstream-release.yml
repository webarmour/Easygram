name: Upstream merge and stable release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-stable-release
  cancel-in-progress: false

jobs:
  update-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Easygram
        uses: actions/checkout@v4
        with:
          ref: easygram-dev
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Check upstream and prepare merge
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/DrKLO/Telegram.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'upstream/master is already included.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff upstream/master

          current=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          [[ "$current" =~ ^[0-9]+$ ]]
          stable_max=$(gh api repos/${GITHUB_REPOSITORY}/releases --paginate \
            --jq '[.[] | select(.draft == false and .prerelease == false) | .tag_name | capture("^[vV]?(?<name>[0-9]+(\\.[0-9]+){1,3})-(?<code>[0-9]+)$") | .code | tonumber] | max // 0')
          next=$((current + 1))
          if (( stable_max >= next )); then next=$((stable_max + 1)); fi
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${next}/" gradle.properties
          echo "version_code=$next" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify release credentials are configured
        if: steps.update.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.EASYGRAM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EASYGRAM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EASYGRAM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EASYGRAM_RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEY STORE_PASSWORD KEY_ALIAS KEY_PASSWORD TELEGRAM_API_ID TELEGRAM_API_HASH; do
            if [[ -z "${!key}" ]]; then echo "Required GitHub secret is missing: $key" >&2; exit 1; fi
          done

      - name: Configure signing and API credentials
        if: steps.update.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.EASYGRAM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EASYGRAM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EASYGRAM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EASYGRAM_RELEASE_KEY_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/easygram-release.keystore"
          printf 'sdk.dir=%s\nEASYGRAM_RELEASE_KEYSTORE=%s\nEASYGRAM_RELEASE_STORE_PASSWORD=%s\nEASYGRAM_RELEASE_KEY_ALIAS=%s\nEASYGRAM_RELEASE_KEY_PASSWORD=%s\nTELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' \
            "$ANDROID_HOME" "$RUNNER_TEMP/easygram-release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > local.properties

      - name: Build stable APK
        if: steps.update.outputs.changed == 'true'
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Verify APK metadata and signature
        if: steps.update.outputs.changed == 'true'
        id: apk
        run: |
          set -euo pipefail
          apk=TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$aapt" dump badging "$apk" | grep -q "package: name='io.github.webarmour.easygram' versionCode='${{ steps.update.outputs.version_code }}9'"
          "$apksigner" verify "$apk"
          echo "sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Commit merge and release version
        if: steps.update.outputs.changed == 'true'
        id: commit
        run: |
          set -euo pipefail
          git add gradle.properties
          git commit -m "Prepare Easygram ${{ steps.update.outputs.version_code }} release"
          git push origin HEAD:easygram-dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish stable GitHub Release
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)
          tag="v${version_name}-${{ steps.update.outputs.version_code }}"
          gh release create "$tag" "${{ steps.apk.outputs.apk }}" \
            --repo "$GITHUB_REPOSITORY" --target "${{ steps.commit.outputs.sha }}" \
            --title "Easygram $tag" --notes "Telegram upstream обновлён до текущего master."
