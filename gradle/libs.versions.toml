# Version catalog for Easygram's own dependencies and Gradle plugins.
# Upstream Telegram dependencies remain in TMessagesProj/build.gradle to keep upstream merges clean.

[versions]
kotlin = "2.1.0"
agp = "8.13.2"
photopicker = "1.0.0-alpha02"
desugarJdkLibs = "2.1.5"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
androidx-photopicker = { module = "androidx.photopicker:photopicker", version.ref = "photopicker" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
